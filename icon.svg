<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" shape-rendering="geometricPrecision">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5C5CF0"/>
      <stop offset="100%" stop-color="#8B6CF6"/>
    </linearGradient>
    <linearGradient id="cell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F2F3F9"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Sudoku-Grid Karte mit weichem Schatten -->
  <g transform="translate(96 112)">
    <rect x="2" y="6" width="320" height="320" rx="28" fill="rgba(0,0,0,0.18)"/>
    <rect width="320" height="320" rx="28" fill="url(#cell)"/>

    <!-- Dünne Linien (3x3 innen) -->
    <g stroke="#DDE0EE" stroke-width="2" stroke-linecap="round">
      <line x1="36"  y1="40"  x2="36"  y2="280"/>
      <line x1="72"  y1="40"  x2="72"  y2="280"/>
      <line x1="144" y1="40"  x2="144" y2="280"/>
      <line x1="180" y1="40"  x2="180" y2="280"/>
      <line x1="252" y1="40"  x2="252" y2="280"/>
      <line x1="284" y1="40"  x2="284" y2="280"/>
      <line x1="40"  y1="36"  x2="280" y2="36"/>
      <line x1="40"  y1="72"  x2="280" y2="72"/>
      <line x1="40"  y1="144" x2="280" y2="144"/>
      <line x1="40"  y1="180" x2="280" y2="180"/>
      <line x1="40"  y1="252" x2="280" y2="252"/>
      <line x1="40"  y1="284" x2="280" y2="284"/>
    </g>
    <!-- Dicke Linien (3x3 Box) -->
    <g stroke="#1F2A44" stroke-width="4" stroke-linecap="round">
      <line x1="108" y1="36"  x2="108" y2="284"/>
      <line x1="216" y1="36"  x2="216" y2="284"/>
      <line x1="36"  y1="108" x2="284" y2="108"/>
      <line x1="36"  y1="216" x2="284" y2="216"/>
    </g>
    <!-- Akzent-Zellen mit Indigo-Hintergrund -->
    <g>
      <rect x="38"  y="146" width="68" height="68" rx="6" fill="#EAEAFD"/>
      <rect x="146" y="38"  width="68" height="68" rx="6" fill="#EAEAFD"/>
      <rect x="218" y="218" width="64" height="64" rx="6" fill="#EAEAFD"/>
    </g>
    <!-- Zahlen — fett, indigoblau -->
    <g fill="#1F2A44" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="800" text-anchor="middle">
      <text x="184" y="84"  font-size="56">5</text>
      <text x="76"  y="192" font-size="56">3</text>
      <text x="252" y="266" font-size="56" fill="#5C5CF0">7</text>
    </g>
  </g>

  <!-- Brandmark unten rechts: kleines "B" -->
  <g transform="translate(370 380)">
    <circle r="58" cx="0" cy="0" fill="#1F2A44"/>
    <text x="0" y="20" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="68" text-anchor="middle" letter-spacing="-3">B</text>
  </g>
</svg>
