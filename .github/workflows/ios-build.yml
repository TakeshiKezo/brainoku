name: Build iOS .ipa (unsigned, für AltStore)

on:
  workflow_dispatch:        # manuell starten via Actions-Tab
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Web (kopiert nach www/)
        run: npm run build:web

      - name: Add iOS Platform
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Patch Info.plist (Orientation + Privacy + Brand)
        run: |
          PLIST="ios/App/App/Info.plist"
          # Portrait-Lock
          plutil -replace UISupportedInterfaceOrientations -json '["UIInterfaceOrientationPortrait"]' "$PLIST"
          plutil -replace UISupportedInterfaceOrientations~ipad -json '["UIInterfaceOrientationPortrait"]' "$PLIST" || true
          # Privacy-Strings (App-Store-Pflicht für jede genutzte Permission)
          plutil -replace NSUserNotificationsUsageDescription -string "Brainoku schickt dir freundliche Erinnerungen, damit du deine Streak nicht verlierst." "$PLIST" || true
          # App-Display-Name (im Home-Bildschirm)
          plutil -replace CFBundleDisplayName -string "Brainoku" "$PLIST" || true
          # Encryption-Export-Compliance auto bestätigen (Standard für Apps ohne Crypto-Spezialfeatures)
          plutil -replace ITSAppUsesNonExemptEncryption -bool false "$PLIST" || true
          # Status-Bar-Style passend zur Lavender-Optik
          plutil -replace UIStatusBarStyle -string "UIStatusBarStyleDefault" "$PLIST" || true
          # Launch-Screen-Hintergrund matcht App-Background
          plutil -p "$PLIST" | grep -i orientation || true

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install --repo-update

      - name: Build Unsigned Archive
        run: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=NO

      - name: Package as .ipa
        run: |
          cd ios/App/build
          mkdir -p Payload
          cp -R App.xcarchive/Products/Applications/App.app Payload/
          zip -qry Brainoku-unsigned.ipa Payload
          ls -lh Brainoku-unsigned.ipa

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Brainoku-unsigned-ipa
          path: ios/App/build/Brainoku-unsigned.ipa
          retention-days: 14
          if-no-files-found: error
